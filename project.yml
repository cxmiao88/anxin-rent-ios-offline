name: AnxinRent
options:
  bundleIdPrefix: com.anxinhuiju
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

targets:
  AnxinRent:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
      - path: Resources/www
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anxinhuiju.zufang
        PRODUCT_NAME: AnxinRent
        MARKETING_VERSION: "1.0.8"
        CURRENT_PROJECT_VERSION: "108"
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
